services:
  openclaw-gateway:
    # The final image will be tagged as openclaw:local for global use
    image: openclaw:local
    build:
      context: .
      dockerfile_inline: |
        FROM openclaw:local
        USER root
        RUN apt-get update && apt-get install -y \
            software-properties-common \
            tor \
            golang-go \
            python3-dev \
            libxml2-dev \
            libxslt1-dev \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            nmap \
            masscan \
            curl \
            git \
            build-essential \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            libncursesw5-dev \
            xz-utils \
            tk-dev \
            libxmlsec1-dev \
            liblzma-dev \
            libpcap-dev \
            && echo "deb http://deb.debian.org/debian bookworm-backports main" > /etc/apt/sources.list.d/backports.list \
            && apt-get update && apt-get install -y -t bookworm-backports \
            python3-pip \
            python3-venv \
            kicad \
            && rm -rf /var/lib/apt/lists/*

        ENV PYENV_ROOT="/opt/pyenv"
        ENV PATH="/opt/pyenv/shims:/opt/pyenv/bin:$$PATH"
        RUN rm -rf /opt/pyenv && \
            curl https://pyenv.run | PYENV_ROOT=/opt/pyenv bash \
            && pyenv install 3.11 \
            && pyenv install 3.12 \
            && pyenv global 3.11 \
            && chmod -R 777 /opt/pyenv

        RUN chmod -R 755 /app/extensions
        USER node
    environment:
      # Channel/runtime tokens (referenced from openclaw.json via ${VAR})
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Crypto / on-chain APIs
      BLOCKSCOUT_API_KEY: ${BLOCKSCOUT_API_KEY:-}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      CRYPTOPANIC_API_KEY: ${CRYPTOPANIC_API_KEY:-}
      # Gmail OAuth (gmail-newsletter)
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      # OSINT
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      ABSTRACT_API_KEY: ${ABSTRACT_API_KEY:-}
      EMAILREP_API_KEY: ${EMAILREP_API_KEY:-}
      NUMVERIFY_API_KEY: ${NUMVERIFY_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      URLSCAN_API_KEY: ${URLSCAN_API_KEY:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      CENSYS_API_KEY: ${CENSYS_API_KEY:-}
      IPQS_API_KEY: ${IPQS_API_KEY:-}
      DEHASHED_API_KEY: ${DEHASHED_API_KEY:-}
      BREACHDIRECTORY_VIA_RAPIDAPI_API_KEY: ${BREACHDIRECTORY_VIA_RAPIDAPI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # startup-seeker
      PRODUCT_HUNT_API_KEY: ${PRODUCT_HUNT_API_KEY:-}
      CRUNCHBASE_API_KEY: ${CRUNCHBASE_API_KEY:-}
      # ascend-web-scrapper (host-side service via host.docker.internal)
      ASCEND_SCRAPPER_URL: ${ASCEND_SCRAPPER_URL:-}
    volumes:
      - ./my-skills:/home/node/.openclaw/workspace/skills:ro
    # No extra_hosts here — openclaw-cli uses network_mode: service:openclaw-gateway,
    # which forbids extra_hosts and inherits /etc/hosts (incl. host.docker.internal) from the gateway.

  openclaw-cli:
    image: openclaw:local
    # Ensure the gateway build finishes before cli starts to use the new image
    depends_on:
      - openclaw-gateway
    environment:
      # Channel/runtime tokens (referenced from openclaw.json via ${VAR})
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Crypto / on-chain APIs
      BLOCKSCOUT_API_KEY: ${BLOCKSCOUT_API_KEY:-}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      CRYPTOPANIC_API_KEY: ${CRYPTOPANIC_API_KEY:-}
      # Gmail OAuth (gmail-newsletter)
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      # OSINT
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      ABSTRACT_API_KEY: ${ABSTRACT_API_KEY:-}
      EMAILREP_API_KEY: ${EMAILREP_API_KEY:-}
      NUMVERIFY_API_KEY: ${NUMVERIFY_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      URLSCAN_API_KEY: ${URLSCAN_API_KEY:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      CENSYS_API_KEY: ${CENSYS_API_KEY:-}
      IPQS_API_KEY: ${IPQS_API_KEY:-}
      DEHASHED_API_KEY: ${DEHASHED_API_KEY:-}
      BREACHDIRECTORY_VIA_RAPIDAPI_API_KEY: ${BREACHDIRECTORY_VIA_RAPIDAPI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # startup-seeker
      PRODUCT_HUNT_API_KEY: ${PRODUCT_HUNT_API_KEY:-}
      CRUNCHBASE_API_KEY: ${CRUNCHBASE_API_KEY:-}
      # ascend-web-scrapper (host-side service via host.docker.internal)
      ASCEND_SCRAPPER_URL: ${ASCEND_SCRAPPER_URL:-}
    volumes:
      - ./my-skills:/home/node/.openclaw/workspace/skills:ro
    # extra_hosts cannot be set here: openclaw-cli uses network_mode: "service:openclaw-gateway"
    # so it inherits the gateway's /etc/hosts (including host.docker.internal).
